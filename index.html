<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ドラッグトリミング</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>画像ドロップでトリミング</h1>
      <p class="description">画像をドロップすると、枠をドラッグして上下左右をトリミングできます。</p>

      <label id="dropZone" class="drop-zone" for="fileInput">
        <input id="fileInput" type="file" accept="image/*" />
        <span id="dropHint">ここに画像をドロップ（またはクリックして選択）</span>
      </label>

      <div id="workspace" class="workspace hidden">
        <canvas id="editorCanvas" width="960" height="540"></canvas>
      </div>

      <div class="actions">
        <button id="cropButton" disabled>トリミング画像を保存</button>
      </div>
      <a id="downloadLink" class="hidden">トリミング画像をダウンロード</a>
    </main>

    <script src="app.js"></script>
  </body>
</html>
